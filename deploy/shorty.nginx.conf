# Install once as /etc/nginx/sites-available/shorty, then let Certbot add HTTPS.
server {
    listen 80;
    server_name shorty.uz;

    root /srv/shorty/frontend/dist;
    index index.html;

    location /v1/ {
        # No URI suffix: preserve /v1/... for the Express routes.
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, rather than append, any client-supplied forwarded IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
